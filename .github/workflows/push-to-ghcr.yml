name: Docker Registry

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - "*.*.*"
      - "test-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom tag for the image (optional, defaults to version from VERSION file)"
        required: false

# NOTE on base-image security patches: apache/superset release tags are built
# once and never rebuilt, so there is no point in scheduled rebuilds against a
# pinned tag. CVE fixes arrive as new superset patch releases — bump the
# VERSION file (the base tag below is derived from it) and cut a release.

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get version
        id: get_version
        run: |
          version=$(cat VERSION)
          echo "version=${version}" >> $GITHUB_OUTPUT
          # VERSION looks like 0.2.0+superset.6.1.0 -> derive the base image tag
          # so Dockerfile and VERSION can never drift apart.
          echo "superset_version=${version##*+superset.}" >> $GITHUB_OUTPUT

      # A "release" is a real version tag (not test-*).
      # Only releases move the stable/latest tags.
      - name: Determine release status
        id: release
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF}" != *test-* ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Docker meta (app)
        id: meta_app
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{ version }}
            type=raw,value=${{ github.event.inputs.tag || github.ref_name }}
            type=raw,value=stable,enable=${{ steps.release.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.get_version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.get_version.outputs.version }}

      - name: Docker meta (worker)
        id: meta_worker
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-worker,onlatest=true
          tags: |
            type=ref,event=tag
            type=semver,pattern={{ version }}
            type=raw,value=${{ github.event.inputs.tag || github.ref_name }}
            type=raw,value=stable,enable=${{ steps.release.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.get_version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.get_version.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (app)
        uses: docker/build-push-action@v6
        with:
          file: ./docker/Dockerfile
          target: app
          platforms: linux/amd64,linux/arm64
          context: .
          # always resolve the freshest base image digest
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}
          build-args: |
            SUPERSET_VERSION=${{ steps.get_version.outputs.superset_version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (worker)
        uses: docker/build-push-action@v6
        with:
          file: ./docker/Dockerfile
          target: worker
          platforms: linux/amd64,linux/arm64
          context: .
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}
          build-args: |
            SUPERSET_VERSION=${{ steps.get_version.outputs.superset_version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max